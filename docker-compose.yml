version: '3.8'

services:
  app:
    build: .
    ports:
      - "8002:8002"
    environment:
      WEB_SERVER_HOST: 0.0.0.0
      WEB_SERVER_PORT: 8002
      SERVER_WEBHOOK_URL: http://host.docker.internal:8002
      TELEGRAM_BOT_TOKEN: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      MONGODB_URI: mongodb://root:example@mongo:27017/chat_db?authSource=admin
      WEBHOOK_URL: http://host.docker.internal:8001/message_service
      WEBHOOK_USER_REGISTRATION_PATH: /user_registration/bot
      WEBHOOK_SEND_MESSAGE_PATH: /send_a_message_to_chat
      WEBHOOK_PLATFORM_REGISTRATION_PATH: /platform_registration/bot
    command:
      ["/app/run.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    

  mongo:
    image: mongo:4.4
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: chat_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
